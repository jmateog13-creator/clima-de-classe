<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e0b1f">
<title>Clima de classe · Tutoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Atkinson+Hyperlegible:wght@400;700&family=VT323&display=swap">
<style>
:root{--fons:#0e0b1f;--tinta:#f7f4ff;--suau:#b5acd9;--fosc:#0e0b1f;--g1:#ff3d81;--g2:#ffb03b;
  --display:"Unbounded",ui-sans-serif,system-ui,sans-serif;--text:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;--osd:"VT323",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--fons);color:var(--tinta);font:400 20px/1.4 var(--text);overflow:hidden}
.diapo{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,2.2vw,30px);padding:clamp(32px,7vw,120px);
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--g1) 50%,transparent),transparent 60%),radial-gradient(100% 90% at 0% 100%,color-mix(in srgb,var(--g2) 40%,transparent),transparent 60%),var(--fons)}
.diapo::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff08 0 2px,transparent 2px 4px)}
.cap,.peu{position:absolute;left:clamp(32px,7vw,120px);right:clamp(32px,7vw,120px);display:flex;justify-content:space-between;align-items:center;z-index:1;gap:14px}
.cap{top:24px}.peu{bottom:22px;color:var(--suau);font-size:16px}
.osd{font-family:var(--osd);font-size:clamp(22px,2.2vw,32px);letter-spacing:.06em}
h1{margin:0;font:900 clamp(44px,8vw,130px)/.95 var(--display);letter-spacing:-.04em;text-wrap:balance}
h1 span,.num{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.num{font:900 clamp(40px,5vw,80px) var(--display)}
.q{margin:0;font:800 clamp(30px,4.6vw,76px)/1.12 var(--display);letter-spacing:-.025em;max-width:22em;text-wrap:balance}
.frase{font:700 clamp(20px,2.4vw,38px)/1.3 var(--text);max-width:32em;margin:0}
.temps{font:900 clamp(30px,4vw,64px) var(--display);font-variant-numeric:tabular-nums;border:4px solid var(--g2);border-radius:18px;padding:6px 22px;background:#0e0b1f99;color:var(--tinta)}
.temps.fi{border-color:var(--g1);color:var(--g1);animation:parp 1s steps(2) infinite}
.temps.fet{border-color:var(--suau);color:var(--suau)}
.barra{position:absolute;left:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--g1),var(--g2));z-index:2;transition:width 1s linear}
.btn{border:0;border-radius:14px;padding:16px 28px;font:900 clamp(20px,2vw,28px) var(--display);background:linear-gradient(90deg,var(--g1),var(--g2));color:var(--fosc);cursor:pointer;text-decoration:none;align-self:flex-start}
.btn.sec{background:#ffffff1f;color:var(--tinta)}
.fila{display:flex;gap:14px;flex-wrap:wrap}
.llista{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(5,auto);gap:10px 28px;counter-reset:q}
@media (max-width:820px){.llista{grid-template-columns:1fr;grid-auto-flow:row;grid-template-rows:none}}
.llista li{counter-increment:q;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:#ffffff12;border-radius:14px;padding:8px 14px;font:700 clamp(14px,1.4vw,26px)/1.22 var(--text)}
.llista li::before{content:counter(q);font:900 clamp(16px,1.8vw,30px)/1 var(--display);color:var(--g2);min-width:1.4em}
@keyframes parp{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
let D, i=0, diapos=[], t=null, segons=0, total=0, fet=new Set(), pausa=false, ctx=null;
function pip(n=3){ try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); for(let k=0;k<n;k++){ const o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.value=880; g.gain.value=.15; o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+k*.28); o.stop(ctx.currentTime+k*.28+.16);} }catch{} }
const minDe=p=>(p.min||D.min||3)*60;
function pinta(){
  clearInterval(t); t=null; pausa=false;
  const d=diapos[i], tot=diapos.length-1;
  let cos='', cap='', peu='';
  if(d.k==='portada'){
    cos=`<span class="osd">● TUTORIA · ${D.preguntes.length} PREGUNTES</span><h1>Busquem <span>solucions</span></h1>${D.intro.map(x=>`<p class="frase">${esc(x)}</p>`).join('')}<div class="fila"><button class="btn" data-go="1">Començar →</button><a class="btn sec" href="full.html" target="_blank">🖨️ Full per imprimir</a></div>`;
    peu=`<span></span><span>Espai: següent →</span>`;
  } else if(d.k==='q'){
    total=minDe(d.p); const ja=fet.has(i); segons=ja?0:total;
    cos=`<span class="num">${String(d.j+1).padStart(2,'0')} / ${String(D.preguntes.length).padStart(2,'0')}</span><p class="q">${esc(d.p.text)}</p>`;
    cap=`<button class="temps${ja?' fet':''}" id="temps" style="cursor:pointer" title="Pausa (P)">${ja?'✓ Fet':'⏱ '+mm(segons)}</button>`;
    peu=`<span>${i?'← Enrere':''}</span><span id="ajuda">${ja?'Espai: següent →':'El temps corre: P pausa · següent quan s\'acabi'}</span>`;
  } else {
    cos=`<span class="osd">■ PUGEM-HO A LA PISSARRA</span><h1 style="font-size:clamp(34px,5vw,80px)">Ho posem <span>en comú</span></h1><ol class="llista">${D.preguntes.map(p=>`<li>${esc(p.text)}</li>`).join('')}</ol>`;
    peu=`<span>← Enrere</span><span><a style="color:var(--g2)" href="full.html" target="_blank">🖨️ Full</a></span>`;
  }
  $('#app').innerHTML=`<article class="diapo"><div class="cap"><span class="osd">▶ ${mm(i)} / ${String(tot).padStart(2,'0')}</span>${cap}</div>${cos}<div class="peu">${peu}</div><div class="barra" id="barra" style="width:${d.k==='q'&&!fet.has(i)?100:0}%"></div></article>`;
  if(d.k==='q'&&!fet.has(i)) engega();
}
function engega(){
  const b=$('#temps'), bar=$('#barra');
  t=setInterval(()=>{ if(pausa) return; segons--; b.textContent='⏱ '+mm(Math.max(0,segons)); bar.style.width=(Math.max(0,segons)/total*100)+'%';
    if(segons<=0){ clearInterval(t); t=null; fet.add(i); b.classList.add('fi'); b.textContent='⏱ Temps!'; $('#ajuda').textContent='Espai: següent →'; pip(); } },1000);
}
function pausar(){ if(!t) return; pausa=!pausa; const b=$('#temps'); b.textContent=(pausa?'⏸ ':'⏱ ')+mm(segons); }
function mou(d){
  const j=i+d; if(j<0||j>=diapos.length) return;
  if(d>0&&diapos[i].k==='q'&&!fet.has(i)){ const a=$('#ajuda'); if(a){ a.textContent='⏳ Encara no: deixem que acabi el temps'; a.style.color='#ffb03b'; setTimeout(()=>{ if(a&&!fet.has(i)){ a.style.color=''; a.textContent='El temps corre: P pausa · següent quan s\'acabi'; } },1800);} return; }
  i=j; pinta();
}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.key==='ArrowRight'){e.preventDefault();mou(1);}
  else if(e.key==='ArrowLeft') mou(-1);
  else if(e.key==='p'||e.key==='P') pausar();
  else if(e.key==='s'||e.key==='S'){ if(diapos[i].k==='q'&&!fet.has(i)){ fet.add(i); clearInterval(t); t=null; mou(1); } }   // sortida d'emergència del profe
  else if(e.key==='f'||e.key==='F') document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
});
$('#app').addEventListener('click',e=>{ if(e.target.closest('[data-go]')) return mou(1); if(e.target.closest('#temps')) return pausar(); if(e.target.closest('a')) return; mou(e.clientX<innerWidth/3?-1:1); });
fetch('preguntes.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{ D=j; diapos=[{k:'portada'},...D.preguntes.map((p,j)=>({k:'q',p,j})),{k:'final'}]; pinta(); });
</script>
</body>
</html>
