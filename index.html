<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e0b1f">
<title>Clima de classe · Tutoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Atkinson+Hyperlegible:wght@400;700&family=VT323&display=swap">
<style>
:root{--fons:#0e0b1f;--tinta:#f7f4ff;--suau:#b5acd9;--fosc:#0e0b1f;--g1:#ff3d81;--g2:#ffb03b;
  --display:"Unbounded",ui-sans-serif,system-ui,sans-serif;--text:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;--osd:"VT323",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--fons);color:var(--tinta);font:400 20px/1.5 var(--text);overflow:hidden}
.diapo{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,2.4vw,32px);padding:clamp(32px,7vw,120px);
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--g1) 50%,transparent),transparent 60%),radial-gradient(100% 90% at 0% 100%,color-mix(in srgb,var(--g2) 40%,transparent),transparent 60%),var(--fons)}
.diapo::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff08 0 2px,transparent 2px 4px)}
.cap,.peu{position:absolute;left:clamp(32px,7vw,120px);right:clamp(32px,7vw,120px);display:flex;justify-content:space-between;align-items:center;z-index:1}
.cap{top:24px}.peu{bottom:22px;color:var(--suau);font-size:16px}
.osd{font-family:var(--osd);font-size:clamp(22px,2.2vw,32px);letter-spacing:.06em}
h1{margin:0;font:900 clamp(48px,9vw,150px)/.95 var(--display);letter-spacing:-.04em;text-wrap:balance}
h1 span,.num{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.num{font:900 clamp(40px,5vw,80px) var(--display)}
.q{margin:0;font:800 clamp(30px,4.6vw,76px)/1.12 var(--display);letter-spacing:-.025em;max-width:22em;text-wrap:balance}
.frase{font:700 clamp(22px,2.6vw,40px)/1.3 var(--text);max-width:30em;margin:0}
.nota{font:700 clamp(18px,1.8vw,28px) var(--text);color:var(--g2);margin:0}
.temps{font:900 clamp(26px,3vw,44px) var(--display);font-variant-numeric:tabular-nums;border:3px solid var(--suau);border-radius:16px;padding:6px 18px;background:#0e0b1f99;cursor:pointer;color:var(--tinta)}
.temps.corre{border-color:var(--g2)}
.temps.fi{border-color:var(--g1);color:var(--g1);animation:parp 1s steps(2) infinite}
@keyframes parp{50%{opacity:.35}}
.btn{border:0;border-radius:14px;padding:16px 28px;font:900 clamp(20px,2vw,28px) var(--display);background:linear-gradient(90deg,var(--g1),var(--g2));color:var(--fosc);cursor:pointer;text-decoration:none;align-self:flex-start}
.btn.sec{background:#ffffff1f;color:var(--tinta)}
.fila{display:flex;gap:14px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D, i=0, diapos=[], t=null, segons=0, corre=false;
const mm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function construeix(){
  const n=D.preguntes.length;
  diapos=[{k:'portada'},...D.preguntes.map((p,j)=>({k:'q',p,j})),{k:'final'}];
}
function pinta(){
  clearInterval(t); corre=false;
  const d=diapos[i], tot=diapos.length-1;
  let cos='';
  if(d.k==='portada') cos=`<span class="osd">● TUTORIA · ${D.preguntes.length} PREGUNTES</span><h1>Clima de <span>classe</span></h1>${D.intro.map(x=>`<p class="frase">${esc(x)}</p>`).join('')}<div class="fila"><button class="btn" data-go="1">Començar →</button><a class="btn sec" href="full.html" target="_blank">🖨️ Full per imprimir</a></div>`;
  else if(d.k==='q'){ segons=d.p.min*60; cos=`<span class="num">${String(d.j+1).padStart(2,'0')} / ${String(D.preguntes.length).padStart(2,'0')}</span><p class="q">${esc(d.p.text)}</p>${d.p.nota?`<p class="nota">${esc(d.p.nota)}</p>`:''}`; }
  else cos=`<span class="osd">■ FINAL</span><h1>Gràcies<span>.</span></h1>${D.final.map(x=>`<p class="frase">${esc(x)}</p>`).join('')}`;
  $('#app').innerHTML=`<article class="diapo"><div class="cap"><span class="osd">▶ ${mm(i)} / ${String(tot).padStart(2,'0')}</span>${d.k==='q'?`<button class="temps" id="temps" title="Temporitzador (T)">⏱ ${mm(segons)}</button>`:''}</div>${cos}<div class="peu"><span>${i?'← Enrere':''}</span><span>${d.k==='q'?'T: temporitzador · ':''}${i<tot?'Espai: següent →':''}</span></div></article>`;
}
function temps(){
  const b=$('#temps'); if(!b) return;
  if(corre){ clearInterval(t); corre=false; b.classList.remove('corre'); return; }
  if(segons<=0) segons=diapos[i].p.min*60;
  corre=true; b.classList.remove('fi'); b.classList.add('corre');
  t=setInterval(()=>{ segons--; b.textContent='⏱ '+mm(Math.max(0,segons)); if(segons<=0){ clearInterval(t); corre=false; b.classList.remove('corre'); b.classList.add('fi'); b.textContent='⏱ Temps!'; } },1000);
}
const mou=d=>{const j=i+d; if(j<0||j>=diapos.length) return; i=j; pinta();};
document.addEventListener('keydown',e=>{ if(e.code==='Space'||e.key==='ArrowRight'){e.preventDefault();mou(1);} else if(e.key==='ArrowLeft') mou(-1); else if(e.key==='t'||e.key==='T') temps(); else if(e.key==='f'||e.key==='F') document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.(); });
$('#app').addEventListener('click',e=>{ if(e.target.closest('[data-go]')) return mou(1); if(e.target.closest('#temps')) return temps(); if(e.target.closest('a')) return; mou(e.clientX<innerWidth/3?-1:1); });
fetch('preguntes.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{D=j;construeix();pinta();});
</script>
</body>
</html>
