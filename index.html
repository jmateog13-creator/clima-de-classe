<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e0b1f">
<title>Clima de classe · Tutoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Atkinson+Hyperlegible:wght@400;700&family=VT323&display=swap">
<style>
:root{--fons:#0e0b1f;--tinta:#f7f4ff;--suau:#b5acd9;--fosc:#0e0b1f;--g1:#ff3d81;--g2:#ffb03b;
  --display:"Unbounded",ui-sans-serif,system-ui,sans-serif;--text:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;--osd:"VT323",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--fons);color:var(--tinta);font:400 20px/1.4 var(--text);min-height:100vh;
  background-image:radial-gradient(120% 90% at 100% 0%,#ff3d8155,transparent 60%),radial-gradient(100% 90% at 0% 100%,#ffb03b44,transparent 60%)}
main{height:100vh;display:flex;flex-direction:column;gap:clamp(8px,1.2vw,18px);padding:clamp(14px,2vw,36px) clamp(20px,4vw,72px)}
.cap{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
h1{margin:0;font:900 clamp(28px,3.6vw,60px)/1 var(--display);letter-spacing:-.04em}
h1 span{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:6px 0 0;font:700 clamp(13px,1.25vw,21px)/1.3 var(--text);color:var(--suau);max-width:60em}
.llista{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(5,1fr);gap:clamp(6px,.9vw,14px) clamp(16px,2.4vw,40px);flex:1;min-height:0;counter-reset:q}
@media (max-width:820px){.llista{grid-template-columns:1fr;grid-auto-flow:row;grid-template-rows:none}}
.llista li{counter-increment:q;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:#ffffff12;border-radius:14px;padding:clamp(6px,.8vw,14px) clamp(12px,1.4vw,22px);font:700 clamp(14px,1.5vw,28px)/1.22 var(--text)}
.llista li::before{content:counter(q);font:900 clamp(18px,2vw,34px)/1 var(--display);background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;min-width:1.4em}
.peu{font-size:13px!important;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;color:var(--suau);font-size:15px}
.temps{font:900 clamp(22px,2.6vw,40px) var(--display);font-variant-numeric:tabular-nums;border:3px solid var(--suau);border-radius:16px;padding:6px 18px;background:#0e0b1f99;cursor:pointer;color:var(--tinta);flex:none}
.temps.corre{border-color:var(--g2)}
.temps.fi{border-color:var(--g1);color:var(--g1);animation:parp 1s steps(2) infinite}
@keyframes parp{50%{opacity:.35}}
a.imp{color:var(--g2);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="cap">
    <div><h1>Busquem <span>solucions</span></h1><p class="sub" id="sub"></p></div>
    <button class="temps" id="temps" title="Temporitzador (T)"></button>
  </div>
  <ol class="llista" id="llista"></ol>
  <div class="peu"><span>T: temporitzador · F: pantalla completa</span><a class="imp" href="full.html" target="_blank">🖨️ Full per imprimir</a></div>
</main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
let segons=0, total=0, t=null, corre=false;
function temps(){
  const b=$('#temps');
  if(corre){ clearInterval(t); corre=false; b.classList.remove('corre'); return; }
  if(segons<=0) segons=total;
  corre=true; b.classList.remove('fi'); b.classList.add('corre');
  t=setInterval(()=>{ segons--; b.textContent='⏱ '+mm(Math.max(0,segons)); if(segons<=0){ clearInterval(t); corre=false; b.classList.remove('corre'); b.classList.add('fi'); b.textContent='⏱ Temps!'; } },1000);
}
document.addEventListener('keydown',e=>{ if(e.key==='t'||e.key==='T') temps(); else if(e.key==='f'||e.key==='F') document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.(); });
$('#temps').onclick=temps;
fetch('preguntes.json',{cache:'no-cache'}).then(r=>r.json()).then(D=>{
  total=segons=D.minuts*60; $('#temps').textContent='⏱ '+mm(total);
  $('#sub').textContent=D.subtitol;
  $('#llista').innerHTML=D.preguntes.map(p=>`<li>${esc(p.text)}</li>`).join('');
});
</script>
</body>
</html>
